<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>Your Wishlist</title>
</head>
<body>
  <div class="content wide">
    <div class="page-head">
      <h2>Your Wishlist ♥</h2>
      <button type="button" class="btn" id="moveAllBtn" onclick="moveAllToCart()">Move all to cart</button>
    </div>
    <div class="book-grid" id="wishGrid"></div>
    <div id="wishEmpty" class="empty-state" style="display:none;">
      <div class="empty-icon">♡</div>
      <h3>Your wishlist is empty</h3>
      <p>Tap the heart on any book to save it for later.</p>
      <a class="btn" href="catalogue.html">Browse books</a>
    </div>
  </div>
</body>
</html>
